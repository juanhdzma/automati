name: Build & push to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/automati

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install python dev deps
        if: hashFiles('backend/requirements-dev.txt') != ''
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        if: hashFiles('backend/tests/**') != ''
        run: python -m pytest backend/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run node tests
        if: hashFiles('tests/frontend/*.test.mjs') != ''
        run: node --test tests/frontend/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
