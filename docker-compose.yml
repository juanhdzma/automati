services:
  automati:
    image: ghcr.io/juanhdzma/automati:latest
    container_name: automati
    restart: unless-stopped
    environment:
      HA_URL: ${HA_URL}
      HOME_TOKEN: ${HOME_TOKEN}
    volumes:
      - db:/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db:
