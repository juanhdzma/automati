services:
  automati:
    image: ghcr.io/juanhdzma/automati:latest
    container_name: automati
    restart: unless-stopped

    # Solo LAN: no hay auth y detras esta el token de Home Assistant.
    # Este puerto no se abre en el router. Ver "Seguridad" en el README.
    ports:
      - "8000:8000"

    environment:
      HA_URL: ${HA_URL}
      HOME_TOKEN: ${HOME_TOKEN}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Sin volumenes: el servicio no guarda estado. Todo vive en Home Assistant.
